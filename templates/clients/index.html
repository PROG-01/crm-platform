{% extends "layout.html" %}

{% block title %}
    Clients
{% endblock %}

{% block main %}
    
    {% if clients %}
        <ul>
            {% for client in clients %}
                <li>
                    <a href="/clients/{{ client['id'] }}">
                        {{ client["name"] }}
                    </a>
                    <span>{{ client["email"] }}</span>
                    <span>{{ client["phone"] }}</span>
                </li>
            {% endfor %}
        </ul>         
    {% else %}
        <p>No clients yet.</p>
    {% endif %}  
{% endblock %}
