{% extends "layout.html" %}

{% block title %}Edit Project{% endblock %}

{% block content %}
    <h1>Edit Project</h1>
    <form method="POST">
        <div class="form-group">
            <label for="project_name">Project Name</label>
            <input type="text" class="form-control" id="project_name" name="project_name" value="{{ project.name }}" required>
        </div>
        <div class="form-group">
            <label for="client">Client</label>
            <select class="form-control" id="client" name="client" required>
                <option value="">Select a client</option>
                {% for client in clients %}
                    <option value="{{ client.id }}" {% if client.id == project.client_id %}selected{% endif %}>{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description">{{ project.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select class="form-control" id="status" name="status" required>
                <option value="">Select a status</option>
                <option value="Not Started" {% if project.status == "Not Started" %}selected{% endif %}>Not Started</option>
                <option value="In Progress" {% if project.status == "In Progress" %}selected{% endif %}>In Progress</option>
                <option value="Completed" {% if project.status == "Completed" %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" class="form-control" id="due_date" name="due_date" value="{{ project.due_date }}">
        </div>
        <button type="submit" class="btn btn-primary">Update Project</button>
    </form>
{% endblock %}
